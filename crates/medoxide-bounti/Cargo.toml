[package]
name = "medoxide-bounti"
version.workspace = true
edition.workspace = true

[dependencies]
# Tenseurs et couches du réseau généré ; `burn-store` lit les poids au format `burnpack`.
# `flex` : backend CPU de Burn (Rust pur), pour séparer l'erreur de conversion de l'arithmétique du GPU dans les tests.
burn = { workspace = true, features = ["flex"] }
burn-store = { workspace = true }
# Lecture des volumes NIfTI et de leur affine (règle `sform`, `qform`, `pixdim`).
medoxide-core = { path = "../medoxide-core" }
# Mode `fetalbet` : masque du cerveau par Fetal-BET.
medoxide-fetalbet = { path = "../medoxide-fetalbet" }
ndarray = { workspace = true }
# Matrices 4×4 de la géométrie (affines voxel → mm).
nalgebra = { workspace = true }
# Écriture des étiquettes et du masque en NIfTI.
nifti = { workspace = true }

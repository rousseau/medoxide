[package]
name = "medoxide-svr"
version.workspace = true
edition.workspace = true

[dependencies]
medoxide-core = { path = "../medoxide-core" }
nalgebra = { workspace = true }
ndarray = { workspace = true }
# Tenseurs et (bientôt) différentiation automatique pour le recalage des coupes (étape 3).
burn = { workspace = true }

[dev-dependencies]
# Pour écrire des fichiers NIfTI synthétiques dans les tests (cas d'erreur).
nifti = { workspace = true }
# Backend CPU de Burn (Rust pur) pour les tests : déterministe, sans GPU ; autodiff pour vérifier les gradients.
burn = { workspace = true, features = ["flex", "autodiff"] }

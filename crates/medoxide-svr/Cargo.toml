[package]
name = "medoxide-svr"
version.workspace = true
edition.workspace = true

[dependencies]
medoxide-core = { path = "../medoxide-core" }
nalgebra = { workspace = true }
ndarray = { workspace = true }
rayon = { workspace = true }
# Lecture du `SliceTiming` du fichier JSON voisin d'un stack (ordre d'acquisition des coupes, F3.2) ; déjà dans le graphe de dépendances.
serde_json = "1"
# Écriture du volume reconstruit au format NIfTI.
nifti = { workspace = true }
# Tenseurs, différentiation automatique et optimiseurs pour le recalage des coupes (étape 3).
# `flex` : backend CPU de Burn (Rust pur), déterministe, sans GPU ; utilisé par les tests et par `--device cpu`.
burn = { workspace = true, features = ["autodiff", "optim", "flex"] }

[features]
# GPU NVIDIA par CUDA (`--device cuda`) ; le recalage reste sur CPU par défaut (voir `pipeline::default_device_kind`).
cuda = ["burn/cuda"]

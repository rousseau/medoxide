[package]
name = "medoxide-svr"
version.workspace = true
edition.workspace = true

[dependencies]
medoxide-core = { path = "../medoxide-core" }
nalgebra = { workspace = true }
ndarray = { workspace = true }
rayon = { workspace = true }
# Tenseurs, différentiation automatique et optimiseurs pour le recalage des coupes (étape 3).
burn = { workspace = true, features = ["autodiff", "optim"] }

[dev-dependencies]
# Pour écrire des fichiers NIfTI synthétiques dans les tests (cas d'erreur).
nifti = { workspace = true }
# Backend CPU de Burn (Rust pur) pour les tests : déterministe, sans GPU .
burn = { workspace = true, features = ["flex"] }

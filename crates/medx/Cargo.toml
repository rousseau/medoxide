[package]
name = "medx"
version.workspace = true
edition.workspace = true

[[bin]]
name = "medx"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
medoxide-bounti = { path = "../medoxide-bounti" }
medoxide-core = { path = "../medoxide-core" }
medoxide-fetalbet = { path = "../medoxide-fetalbet" }
medoxide-svr = { path = "../medoxide-svr" }

[features]
# GPU NVIDIA par CUDA pour les réseaux et le recalage : `cargo build --release --features cuda` (Linux avec CUDA Toolkit).
cuda = ["medoxide-bounti/cuda", "medoxide-fetalbet/cuda", "medoxide-svr/cuda"]
